      - {click: BackSpace, label: ⌫, swipe_left: Escape, width: 15}
      # 底列骨架與注音／蝦米一致：15 / 10 / 10 / space 40 / 10 / 15。
      # 原本 5% 寬的 / 與 ' 降為長按（自然碼雙拼不用它們當編碼）。
      - {click: Keyboard_symbols, long_click: Keyboard_number, width: 15}
      - {click: ',', long_click: '、', swipe_up: liquid_keyboard_emoji, width: 10}
      - {click: Punct_question, long_click: '《》{Left}', swipe_up: "'", swipe_down: Punct_semicolon, width: 10}
