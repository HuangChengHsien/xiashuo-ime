      - {click: u, long_click: '「」{Left}'}
      - {click: i, long_click: Punct_bracketright}
      - {click: o, long_click: '『』{Left}'}
      - {click: p, long_click: Punct_braceright}
      # 第三列改為 9 鍵（去掉 ;），左右各留 5%——錯位來自列數差，不是硬位移。
      # 長按維持 hjkl 方向鍵標準，不因排列改動而變。
      - {width: 5}
      - {click: a, long_click: select_all}
      - {click: s, long_click: Home}
      - {click: d, long_click: End}
      - {click: f, long_click: Page_Up}
      - {click: g, long_click: Page_Down}
      - {click: h, long_click: Left}
      - {click: j, long_click: Down}
      - {click: k, long_click: Up}
      - {click: l, long_click: Right}
      - {width: 5}
      # 第四列：Shift 15 + 7 字根鍵 + ⌫ 15，寬度與原版相同。
      - {click: Shift_L, long_click: Shift_L, width: 15}
      - {click: z, long_click: '`', width: 10}
      - {click: x, long_click: cut, width: 10}
      - {click: c, long_click: copy, width: 10}
      - {click: v, long_click: paste, width: 10}
      - {click: b, long_click: '~', width: 10}
      - {click: n, long_click: Insert, width: 10}
      - {click: m, long_click: Delete, width: 10}
      - {click: BackSpace, label: ⌫, swipe_left: Escape, width: 15}
      # 底列：常用的 , ; . 三顆全部單按；長按各取實體 QWERTY 上的右鄰鍵。
      - {click: Keyboard_symbols, long_click: Keyboard_number, width: 15}
      # 單按：未組字→直出中文標點；組字中→送 ASCII 碼給 Rime。
      # 長按：一律送 ASCII 碼，供「以 , . ; 開頭」的字根起首使用（起首後就回到單按）。
      # 上滑：次要符號。
      # , 與 . 同為字根：單按一律送 ASCII 碼給 Rime，照嘸蝦米原本的打法（按 , 再按 space 才出字）。
      - {click: ',', long_click: Comma_direct, swipe_up: '、', width: 10}
      - {click: Semicolon_direct, composing: Semicolon_code, long_click: Punct_question, swipe_up: Semicolon_code, swipe_down: "'", width: 10}
      - {click: space, long_click: Keyboard_english, width: 40, swipe_up: Up, swipe_down: Down}   # 長按空白鍵→英文鍵盤
      # . 是字根起首（.,→；  ..→：），所以單按一律送 ASCII 碼給 Rime，不直出句號。
      # 句號改由長按取得；/ 移到上滑。
      - {click: ., long_click: Period_direct, swipe_up: Slash_direct, width: 10}
      - {click: Return, composing: Return1, long_click: CommitRawInput, width: 15}
