  Date: {label: 日期, command: date, option: "yyyy-MM-dd"}
  ChineseDate: {label: 農曆, command: date, option: "zh_CN@calendar=chinese"} #農曆等日期(>=Android 7.0)：date 語言@calendar=曆法 格式。詳見https://developer.android.com/reference/android/icu/util/Calendar.html
  Time: {label: 時間, command: date, option: "HH:mm:ss"} #時間： date 格式
  TrimeApp: {label: 同文, command: run, option: "com.osfans.trime"} #執行 App： run：套件名稱
  TrimeCmp: {label: 同文元件, command: run, option: "com.osfans.trime/.ui.main.MainActivity"} #執行 App 指定元件： run：套件名稱／元件名稱
  Homepage: {label: 同文首頁, command: run, option: "https://github.com/osfans/trime"} #查看網頁: run 網址
  CommitHomepage: {label: 同文網址, commit: https://github.com/osfans/trime} #直接送出
  Wiki: {label: 維基, command: run, option: "https://zh.wikipedia.org/wiki/%s"} #搜尋網頁: %s或%1$s為目前字元
  Google: {label: Google, command: run, option: "https://www.google.com/search?q=%s"} #搜尋網頁: %s或%1$s為目前字元
  MoeDict: {label: 萌典, command: run, option: "https://www.moedict.tw/%3$s"} #搜尋網頁: %3$s為游標前字元
  WebSearch: {label: 搜尋網頁, command: web_search, option: "%4$s"} #搜尋，其他view、dial、edit、search等intent，參考 Android Intent 文件：https://developer.android.com/reference/android/content/Intent.html
  Search: {label: 搜尋, command: search, option: "%1$s"} #搜尋簡訊、字典等
  Share: {label: 分享, command: send, option: "%s"} #分享指定文字: %s或%1$s為目前字元
  Deploy: {label: 部署, send: FUNCTION, command: apply, option: "DEPLOY"} #重新部署
  Sync: {label: 同步, send: FUNCTION, command: apply, option: "SYNC_USER_DATA"} #使用者資料同步
  updateConfig: {label: 更新設定, send: FUNCTION, command: apply, option: "UPDATE_CONFIG"} #更新設定檔
  RepeatCommit: { label: 重複,  command: commit, option: "%1$s" } #重複輸入剛送出的內容

preset_keyboards:
  # 不改 ascii_mode 的分頁入口：避免 Trime 切鍵盤時自動提交未完成組字。
  liur_menu_main:
    name: 蝦米常用功能
    ascii_mode: 0
    reset_ascii_mode: true
    lock: false
    width: 50
    height: 64
    keys:
      - {click: Liur_continuous, key_text_size: 16}
      - {click: Liur_lookup, key_text_size: 16}
      - {click: Liur_english_completion, key_text_size: 16}
      - {click: Liur_mixed_sentence, key_text_size: 16}
      - {click: Liur_menu_hints_open, key_text_size: 16}
      - {click: Liur_menu_advanced_open, key_text_size: 16}
      - {click: Liur_menu_back, width: 100}
  liur_menu_hints:
    __include: /preset_keyboards/liur_menu_main
    name: 蝦米字碼提示
    keys:
      - {click: Liur_hint_zrm, key_text_size: 16}
      - {click: Liur_hint_bpmf, key_text_size: 16}
      - {click: Liur_hint_learning, width: 100}
      - {click: Liur_menu_home}
      - {click: Liur_menu_back}
  liur_menu_advanced:
    __include: /preset_keyboards/liur_menu_main
    name: 蝦米進階設定
    height: 54
    keys:
      - {click: Liur_full_shape, key_text_size: 16}
      - {click: Liur_simplification, key_text_size: 16}
      - {click: Liur_quick, key_text_size: 16}
      - {click: Liur_wildcard, key_text_size: 16}
      - {click: Liur_charset, key_text_size: 16}
      - {click: Liur_tw, key_text_size: 16}
      - {click: Liur_emoji, key_text_size: 16}
      - {click: menu_keyboard, label: 完整選單, key_text_size: 16}
      - {click: Liur_menu_home}
      - {click: Liur_menu_back}
  liur_menu_main_ascii:
    __include: /preset_keyboards/liur_menu_main
