      - {click: '7', long_click: '&'}
      - {click: '8', long_click: '*'}
      - {click: '9', long_click: '（）{Left}'}
      - {click: '0', long_click: )}
      - {click: q, long_click: Punct_underscore}
      - {click: w, long_click: '-'}
      - {click: e, long_click: +}
      - {click: r, long_click: '='}
      - {click: t, long_click: Punct_bar}
      - {click: y, long_click: Punct_backslash}
      - {click: u, long_click: '「」{Left}'}
      - {click: i, long_click: Punct_bracketright}
      - {click: o, long_click: '『』{Left}'}
      - {click: p, long_click: Punct_braceright}
      - {click: a, long_click: select_all}
      - {click: s, long_click: Home}
      - {click: d, long_click: End}
      - {click: f, long_click: Page_Up}
      - {click: g, long_click: Page_Down}
      - {click: h, long_click: Left}
      - {click: j, long_click: Down}
      - {click: k, long_click: Up}
      - {click: l, long_click: Right}
      - {click: ;, long_click: Punct_colon}
      - {click: Shift_L, width: 15}
      - {click: z, long_click: '`', width: 10}
      - {click: x, long_click: cut, width: 10}
      - {click: c, long_click: copy, width: 10}
      - {click: v, long_click: paste, width: 10}
      - {click: b, long_click: '~', width: 10}
      - {click: n, long_click: Insert, width: 10}
      - {click: m, long_click: Delete, width: 10}
      - {click: BackSpace, label: ⌫, swipe_left: Escape, width: 15}
      # 底列：移除重複的中英切換與 Emoji；Space 針對右側誤觸往右擴張。
      # 左側 3 鍵合計 30%，Space 45%，右側 4 鍵合計 25%。
      # Space 往右擴張 5%；保留常用的句號與 Enter 原寬，只縮小斜線與引號。
      - {click: Keyboard_symbols, long_click: Keyboard_number, width: 10}
      - {click: ',', long_click: '《》{Left}', width: 10}
      - {click: '、', long_click: '・', width: 10}
      - {click: space, width: 45, swipe_up: Up, swipe_down: Down}   # 左右交給 slide_cursor 跟手拖曳；swipe_left/right 不設，slide_cursor 觸發時 ACTION_UP 會搶先 return，設了也不會生效。長按叫方案選單已移除：跟工具列的蝦/雙/注按鈕重複，且常誤觸擋掉滑動游標
      - {click: ., long_click: Punct_greater, width: 7.5}
      - {click: Slash_direct, long_click: Punct_question, width: 5}
      - {click: "'", long_click: Punct_quotedbl, width: 5}
      - {click: Return, composing: Return1, long_click: CommitRawInput, width: 7.5}
