# ============================================================
# tool_bar — 鍵盤上方那一列（左邊齒輪主選單、右邊 ▾ 之間的空白）
#
# action 用的是 preset_keys 的名稱，跟鍵盤按鍵同一套語法。
# style 可以是 ic@圖示名，或用 option_styles 做開／關兩態文字。
# ============================================================
tool_bar:
  button_spacing: 8
  back_style: "ic@arrow-left"

  # 單擊在所有方案都開 Trime 原生選單；完整蝦米長按開分頁功能面板。
  # 精簡蝦米沒有 Lua 處理器，不能把單擊交給 Liur_menu_open。
  primary_button:
    foreground: { style: "ic@cog", normal: candidate_text_color, padding: 8 }
    action: menu_keyboard
    long_press_action: Liur_menu_open

  buttons:
    # Trime 會以反向順序顯示 buttons。實際畫面目標：
    # 🎙(單色)｜🙂｜剪貼簿(單色)｜ㄅ｜雙｜蝦｜中/En
    # 最右側保留 Mode_switch（英文補完模式）；密碼欄由 Trime 自動切 ASCII 直通。
    - foreground: { option_styles: [ "中", "En" ], font_size: 17, normal: candidate_text_color, padding: 8 }
      action: Mode_switch
    - foreground: { style: "蝦", font_size: 17, normal: candidate_text_color, padding: 8 }
      action: Schema_liur
    - foreground: { style: "雙", font_size: 17, normal: candidate_text_color, padding: 8 }
      action: Schema_zrm
    - foreground: { style: "ㄅ", font_size: 17, normal: candidate_text_color, padding: 8 }
      action: Schema_bpmf
    # 剪貼簿使用 Trime 內建單色 icon；短按直接貼上，長按開剪貼簿。
    - foreground: { style: "ic@clipboard", normal: candidate_text_color }
      action: paste
      long_press_action: clipboard_window
    - foreground: { style: "🙂", font_size: 17, normal: candidate_text_color, padding: 8 }
      action: liquid_keyboard_emoji
    # 語音改用 Trime icon style，避免 Android 彩色 Emoji 麥克風。
    - foreground: { style: "ic@microphone", normal: candidate_text_color }
      action: Voice_Input
    # 潤飾目前選取的文字；生成結果會先預覽，確認後才替換。
    - foreground: { style: "潤", font_size: 17, normal: candidate_text_color, padding: 8 }
      action: gemma_rewrite
    # 把選取的文字用本機 LLM 翻譯成英文；結果先預覽，確認後才替換。
    - foreground: { style: "譯", font_size: 17, normal: candidate_text_color, padding: 8 }
      action: llm_translate_en


