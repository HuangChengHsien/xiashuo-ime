# Trime default style settings
# encoding: utf-8

config_version: "3.0.143-bundled-translate"  # ⚠️ 改動本檔後務必把這個版本號調高：
                           # Trime 用 Rime.deployRimeConfigFile(id, "config_version")
                           # 編譯主題，版本號沒變就跳過重編；而 build/dak66.trime.yaml
                           # 不存在時會退回讀 App 私有目錄的預編譯版，
                           # 於是 /sdcard/rime/dak66.trime.yaml 的修改完全不會生效。
# keyboard-height-profile: taller-22pct 2026-08-19
name: 臺灣三方案（嘸蝦米・自然碼・注音） #方案名稱；檔名用 dak66.trime.yaml，避免和內建 trime.yaml 共用主題 ID 而在清單中重複出現
author: osfans（本地修改版） #作者資訊

style:
  auto_caps: false #自動句首大寫:true|false
  candidate_font: [ NotoSansTC-Regular.ttf ] #候選字型；Trime 3.3 字型欄位須寫成清單，檔案須放在 fonts/，找不到時用系統字型
  candidate_padding: 5 #候選項內距
  candidate_spacing: 0.0 #候選分割線
  candidate_text_size: 22 #候選字號
  candidate_text_vertical_bias: 1.0 #候選文字垂直偏移位置（僅 overlay 模式使用，需要間距足夠，範圍 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  candidate_view_height: 28 #候選區高度
  #candidate_corner_radius: 4 #候選項圓角半徑
  comment_font: [ NotoSansTC-Regular.ttf ] #編碼／反查提示字型；英數字先由 latin_font 顯示
  comment_height: 12 #編碼提示區高度（僅 top 模式約束高度，其餘模式與 candidate_view_height 無區別）
  comment_position: right #編碼提示位置：right / top / overlay
  comment_vertical_bias: 0.0 #編碼提示垂直偏移位置（僅 overlay 模式使用，需要間距足夠，範圍 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  comment_text_size: 10 #編碼提示字號
  hanb_font: [ NotoSansTC-Regular.ttf ] #擴充漢字 fallback：接在各欄位字型之後；極罕見字仍可能需更完整字庫
  horizontal_gap: 4 #鍵水平間距（由 1 加大，配合 vertical_gap 6）
  keyboard_padding: 0 #直向螢幕模式下，螢幕左右兩側與鍵盤的距離（曲面螢幕減少誤觸）
  keyboard_padding_left: 0 #直向螢幕模式下，左手鍵盤配置，螢幕左側與鍵盤的距離
  keyboard_padding_right: 40 #直向螢幕模式下，左手鍵盤配置，螢幕右側與鍵盤的距離
  keyboard_padding_bottom: 28 #直向螢幕模式下，螢幕下邊緣與鍵盤的距離（避免誤觸發全螢幕手勢）
  keyboard_padding_land: 40 #橫向螢幕模式下，螢幕左右兩側與鍵盤的距離（避免橫向螢幕按鍵過度拉伸變形）
  keyboard_padding_land_bottom: 12 #橫向螢幕模式下，螢幕下側與鍵盤的距離
  key_font: [ BarlowCondensed-Regular.ttf ] #鍵盤主按鍵字型；Barlow Condensed 無中文字形時由系統字型 fallback
  key_height: 54 #鍵高
  key_long_text_size: 14 #長標籤字號
  key_text_size: 22 #鍵字號
  key_width: 10.0 #鍵寬，佔螢幕寬的百分比
  label_text_size: 22 #標籤字號
  label_font: [ BarlowCondensed-Regular.ttf ] #候選序號字型
  latin_font: [ BarlowCondensed-Regular.ttf ] #西文字型：Trime 會把它排在每個字型欄位最前面，候選與註解的英數字也使用它
  keyboard_height: 315 #Pixel 8 Pro 實測：比 330 少 15dp（45px），整體頂端與 Gboard 對齊
  keyboard_height_land: 264 #鎖定橫向螢幕下鍵盤高度（原 244，同步 +20）
  popup_font: [ BarlowCondensed-Regular.ttf ] #按鍵彈出提示字型（Trime 3.3 已不讀 preview_font）
  preview_height: 60 #按鍵提示高度
  preview_offset: -12 #按鍵提示垂直偏移
  preview_text_size: 40 #按鍵提示字號
  reset_ascii_mode_on_focus_change: false #焦點變更顯示輸入法螢幕鍵盤時，重置 ascii_mode
  round_corner: 8 #按鍵圓角半徑
  shadow_radius: 0.0 #按鍵陰影半徑
  symbol_font: [ symbol.ttf ] #按鍵上方符號字型；未附 symbol.ttf 時用系統字型
  symbol_text_size: 10 #符號字號
  text_font: [ BarlowCondensed-Regular.ttf ] #組字區編碼字型
  vertical_gap: 6 #鍵盤行距（由 1 加大；改動時記得同步 keyboard_height）
  #background_folder: #背景圖片保存在background目錄下的哪個子目錄
  enter_label_mode: 0  #是否使用App 提供的 ActionLabel 內容作為 Enter 鍵的文字（由於多數App尚未支援ActionLabel，實際影響不大）。0不使用，1只使用 ActionLabel，2優先使用，3當其他方式沒有取得 label 時才讀取ActionLabel
  enter_labels:  # 定義 Enter 鍵的文字
    go: 前往
    done: 完成
    next: 下一個
    pre:  上一個
    search: 搜尋
    send: 傳送
    default: ⏎   # 預設 Enter 鍵文字；前往／搜尋／傳送等情境仍顯示中文

preedit:                  # 預編輯文字視圖參數
  horizontal_padding: 8     # 橫向內距（整數）
#  alpha: 0.8                 # 透明度（0-1，浮點）
  top_end_radius: 4         # 末上端圓角（浮點）
  foreground:               # 前景樣式
    font_size: 16             # 預編輯字體大小（浮點）

window:               # 候選視窗（浮動視窗）參數
  insets:               # 視窗內距
    vertical: 4           # 垂直內距（整數）
    horizontal: 4         # 橫向內距（整數）
  item_padding:         # 候選項內距
#    vertical: 0           # 垂直內距（整數）
    horizontal: 4         # 橫向內距（整數）
#  min_width: 0          # 最小寬度（整數）
#  corner_radius: 0      # 圓角半徑（浮點）
#  border: 0             # 邊框寬度（整數）
#  shadow: 0.0           # 陰影半徑（浮點）
#  alpha: 1              # 透明度（0-1，浮點）
  foreground:           # 前景樣式
    label_font_size: 20   # 序號字體大小（浮點）
    text_font_size: 20    # 文字字體大小（浮點）
    comment_font_size: 16  # 註解字體大小（浮點）

# 最好保留一項，防止其他主題使用 __include 時無法載入
fallback_colors:
  candidate_text_color: text_color
