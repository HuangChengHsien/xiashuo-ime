    name: 嘸蝦米
    author: "osfans <waxaca@163.com>"
    ascii_mode: 0
    reset_ascii_mode: true   # 從英文鍵盤切回來時，自動恢復中文模式
    width: 10
    height: 54
    lock: true
    # 方案自有完整排列；與雙拼外觀相同，但按鍵行為可獨立演進。
    keys:
      - {click: '1', long_click: Punct_exclam}
