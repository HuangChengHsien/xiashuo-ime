  double_pinyin:
    name: 自然碼雙拼
    author: "osfans <waxaca@163.com>"
    ascii_mode: 0
    reset_ascii_mode: true   # 從英文鍵盤切回來時，自動恢復中文模式
    width: 10
    height: 54
    lock: true
    # 方案自有完整排列；不要改成 include/default，避免方案專屬手勢互相影響。
    keys:
      - {click: '1', long_click: Punct_exclam}
      - {click: '2', long_click: '@'}
      - {click: '3', long_click: '#'}
      - {click: '4', long_click: $}
      - {click: '5', long_click: '%'}
      - {click: '6', long_click: ^}
      - {click: '7', long_click: '&'}
      - {click: '8', long_click: '*'}
      - {click: '9', long_click: '（）{Left}'}
      - {click: '0', long_click: )}
      - {click: q, long_click: Punct_underscore}
      - {click: w, long_click: '-'}
      - {click: e, long_click: +}
      - {click: r, long_click: '='}
      - {click: t, long_click: Punct_bar}
      - {click: y, long_click: Punct_backslash}
      - {click: u, long_click: '「」{Left}'}
      - {click: i, long_click: Punct_bracketright}
      - {click: o, long_click: '『』{Left}'}
      - {click: p, long_click: Punct_braceright}
      - {width: 5}
      - {click: a, long_click: select_all}
      - {click: s, long_click: Home}
      - {click: d, long_click: End}
      - {click: f, long_click: Page_Up}
      - {click: g, long_click: Page_Down}
      - {click: h, long_click: Left}
      - {click: j, long_click: Down}
      - {click: k, long_click: Up}
      - {click: l, long_click: Right}
      - {width: 5}
      # 第三列改 9 鍵、左右各留 5%：錯位來自列數差（10/9/9），不是硬位移。
      # ; 不是自然碼編碼，移到 ？ 鍵的下滑。
      - {click: Shift_L, long_click: Shift_L, width: 15}
      - {click: z, long_click: '`', width: 10}
      - {click: x, long_click: cut, width: 10}
      - {click: c, long_click: copy, width: 10}
      - {click: v, long_click: paste, width: 10}
