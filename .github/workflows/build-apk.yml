# Builds an arm64-v8a APK on every push and uploads it as a workflow artifact.
# With the SIGNING_* repository secrets set, a signed release APK is built;
# without them, a debug APK (package com.osfans.trime.debug) is built instead.
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILD_ABI: arm64-v8a
      NDK_VERSION: 28.0.13004108
      CMAKE_VERSION: 3.31.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "build-tools;36.0.0" "platforms;android-36"

      - name: Cache Boost source
        uses: actions/cache@v4
        with:
          path: app/boost-*.tar.xz
          key: boost-${{ hashFiles('app/src/main/jni/cmake/Boost.cmake') }}

      # Fetch Boost with retries and a checksum check up front; CMake reuses
      # app/boost-<version>.tar.xz when it already exists.
      - name: Download Boost
        run: |
          version=$(sed -n 's/^set(BOOST_VERSION \(.*\))$/\1/p' app/src/main/jni/cmake/Boost.cmake)
          sha=$(grep -o '[0-9a-f]\{64\}' app/src/main/jni/cmake/Boost.cmake | head -1)
          file="app/boost-$version.tar.xz"
          if [ -f "$file" ] && echo "$sha  $file" | sha256sum -c --status; then
            echo "Using cached $file"
            exit 0
          fi
          rm -f "$file"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "$file" \
            "https://github.com/boostorg/boost/releases/download/boost-$version/boost-$version-cmake.tar.xz"
          echo "$sha  $file" | sha256sum -c

      # Without the SIGNING_* secrets the debug APK is signed with
      # ~/.android/debug.keystore, which a fresh runner regenerates every run.
      # Reuse one key so each debug APK installs over the previous one.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Configure signing
        id: signing
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          git config --global user.name "github-actions"
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            {
              echo "keyBase64=$SIGNING_KEY_BASE64"
              echo "storePassword=$SIGNING_STORE_PASSWORD"
              echo "keyAlias=$SIGNING_KEY_ALIAS"
              echo "keyPassword=$SIGNING_KEY_PASSWORD"
            } > keystore.properties
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_* secrets are not set; building a debug APK instead."
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: ./gradlew --stacktrace :app:${{ steps.signing.outputs.task }}

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties app/build/sign-*.ks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiashuo-${{ github.ref_name == 'main' && 'main' || 'branch' }}-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
