# Builds an arm64-v8a APK on every push and uploads it as a workflow artifact.
# With the SIGNING_* repository secrets set, a signed release APK is built;
# without them, a debug APK (package com.osfans.trime.debug) is built instead.
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILD_ABI: arm64-v8a
      NDK_VERSION: 28.0.13004108
      CMAKE_VERSION: 3.31.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "build-tools;36.0.0" "platforms;android-36"

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost-*.tar.xz
          key: native-${{ runner.os }}-${{ hashFiles('.gitmodules', 'app/src/main/jni/**/CMakeLists.txt', 'app/src/main/jni/cmake/*.cmake') }}
          restore-keys: native-${{ runner.os }}-

      - name: Configure signing
        id: signing
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          git config --global user.name "github-actions"
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            {
              echo "keyBase64=$SIGNING_KEY_BASE64"
              echo "storePassword=$SIGNING_STORE_PASSWORD"
              echo "keyAlias=$SIGNING_KEY_ALIAS"
              echo "keyPassword=$SIGNING_KEY_PASSWORD"
            } > keystore.properties
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_* secrets are not set; building a debug APK instead."
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: ./gradlew --stacktrace :app:${{ steps.signing.outputs.task }}

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties app/build/sign-*.ks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiashuo-${{ github.ref_name == 'main' && 'main' || 'branch' }}-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
